<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>WebArchive</title>
    <!-- Use Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/lib.js"></script>
    <script src="/static/main.js"></script>
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar glass">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span id="site_title_sidebar">WebArchive</span>
        </div>
        
        <ul class="nav-menu">
            <li class="nav-item active" id="nav_dashboard" onclick="setTab('dashboard')">Dashboard</li>
            <li class="nav-item" id="nav_all_links" onclick="setTab('all_links')">All Links</li>
            <li class="nav-item" id="nav_collections" onclick="setTab('collections')">Collections</li>
            
            <li class="nav-item" style="margin-top: 32px; font-size: 12px; font-weight: 700; opacity: 0.5; cursor: default;">TAGS</li>
            <div id="tags_container">
                <!-- Tags populated dynamically via JS -->
            </div>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar glass">
            <div class="search-container">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search_input" class="search-input" placeholder="Search archives by title or URL...">
            </div>
            
            <!-- New Archive Button -->
            <button class="btn-primary" onclick="showNewArchiveModal()" style="margin-left: auto; margin-right: 8px; padding: 8px 16px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;">+ New Archive</button>
            <button class="btn-primary" onclick="showNewCollectionModal()" style="margin-right: 16px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-primary); font-weight: 600; cursor: pointer;">+ Collection</button>

            <!-- View Toggles -->
            <div class="view-toggles" id="view_toggles_container">
                <button id="btn_grid_view" class="toggle-btn active" title="Grid View">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                </button>
                <button id="btn_list_view" class="toggle-btn" title="List View">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                </button>
            </div>
        </header>

        <!-- Dynamic Data Container -->
        <div id="data" class="data-container">
            Loading...
        </div>
    </main>
</div>

<!-- New Archive Modal -->
<div id="new_archive_modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="glass" style="padding: 24px; width: 400px; display: flex; flex-direction: column; gap: 16px;">
        <h3>New Archive</h3>
        <label style="display: flex; flex-direction: column; gap: 4px; color: var(--text-secondary); font-size: 14px;">
            URL
            <input type="text" id="new_archive_url" class="search-input" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); color: var(--text-primary);" placeholder="https://example.com">
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; color: var(--text-secondary); font-size: 14px;">
            Tags
            <input type="text" id="new_archive_tags" class="search-input" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); color: var(--text-primary);" placeholder="Tags (comma separated)">
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; color: var(--text-secondary); font-size: 14px;">
            Collection
            <select id="new_archive_collection" class="search-input" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); color: var(--text-primary);">
                <option value="" style="background: var(--bg-dark);">No Collection</option>
            </select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; color: var(--text-secondary); font-size: 14px;">
            Link Depth
            <input type="number" id="new_archive_depth" class="search-input" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); color: var(--text-primary);" placeholder="0" min="0" value="0" oninput="toggleSublinkMarkdownVisibility()">
            <span style="font-size: 11px; color: var(--text-secondary);">(Note: link depth > 1 might cause large archives)</span>
        </label>
        <label style="display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 14px; cursor: pointer;">
            <input type="checkbox" id="new_archive_markdown" style="width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer;" onchange="toggleSublinkMarkdownVisibility()">
            Include Markdown Format
        </label>
        <label id="new_archive_sublink_markdown_wrapper" style="display: none; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 14px; cursor: pointer; padding-left: 24px;">
            <input type="checkbox" id="new_archive_sublink_markdown" style="width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer;">
            Capture markdown for sub-links
        </label>
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px;">
            <button onclick="hideNewArchiveModal()" style="background: transparent; border: 1px solid var(--glass-border); color: var(--text-primary); padding: 8px 16px; border-radius: 8px; cursor: pointer;">Cancel</button>
            <button onclick="submitNewArchive()" style="background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;">Archive</button>
        </div>
    </div>
</div>

<!-- New Collection Modal -->
<div id="new_collection_modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="glass" style="padding: 24px; width: 400px; display: flex; flex-direction: column; gap: 16px;">
        <h3>New Collection</h3>
        <label style="display: flex; flex-direction: column; gap: 4px; color: var(--text-secondary); font-size: 14px;">
            Name
            <input type="text" id="new_collection_name" class="search-input" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); color: var(--text-primary);" placeholder="Collection Name">
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; color: var(--text-secondary); font-size: 14px;">
            Description
            <textarea id="new_collection_desc" class="search-input" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); color: var(--text-primary); min-height: 80px;" placeholder="Description"></textarea>
        </label>
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px;">
            <button onclick="hideNewCollectionModal()" style="background: transparent; border: 1px solid var(--glass-border); color: var(--text-primary); padding: 8px 16px; border-radius: 8px; cursor: pointer;">Cancel</button>
            <button onclick="submitNewCollection()" style="background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;">Create</button>
        </div>
    </div>
</div>

<!-- Edit Archive Modal -->
<div id="edit_archive_modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="glass" style="padding: 24px; width: 400px; display: flex; flex-direction: column; gap: 16px;">
        <h3>Edit Archive</h3>
        <input type="hidden" id="edit_archive_id">
        <label style="display: flex; flex-direction: column; gap: 4px; color: var(--text-secondary); font-size: 14px;">
            Title
            <input type="text" id="edit_archive_title" class="search-input" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); color: var(--text-primary);" placeholder="Title">
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; color: var(--text-secondary); font-size: 14px;">
            Description
            <textarea id="edit_archive_desc" class="search-input" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); color: var(--text-primary); min-height: 80px;" placeholder="Description"></textarea>
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; color: var(--text-secondary); font-size: 14px;">
            Tags
            <input type="text" id="edit_archive_tags" class="search-input" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); color: var(--text-primary);" placeholder="Tags (comma separated)">
        </label>
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px;">
            <button onclick="hideEditArchiveModal()" style="background: transparent; border: 1px solid var(--glass-border); color: var(--text-primary); padding: 8px 16px; border-radius: 8px; cursor: pointer;">Cancel</button>
            <button onclick="submitEditArchive()" style="background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;">Save</button>
        </div>
    </div>
</div>

<!-- Error Modal -->
<div id="error_modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 1100; align-items: center; justify-content: center;">
    <div class="glass" style="padding: 24px; width: 500px; display: flex; flex-direction: column; gap: 16px;">
        <h3 style="color: #ef4444;">Error Details</h3>
        <pre id="error_modal_text" style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; color: var(--text-secondary); font-size: 13px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; font-family: monospace;"></pre>
        <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
            <button onclick="$('#error_modal').css('display', 'none');" style="background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;">Close</button>
        </div>
    </div>
</div>

<!-- Templates -->
<template id="collection_card_tmpl">
    <div class="archive-card glass item-container" style="border-top: 2px solid var(--accent);">
        <div class="card-header">
            <span class="status-badge" style="background: var(--accent); color: white; border: none;">COLLECTION</span>
        </div>
        <h3 class="card-title title-text" style="margin-top: 8px;"></h3>
        <p class="card-desc desc-text" style="flex: 1;"></p>
        <div class="card-footer">
            <span class="created-text"></span>
        </div>
    </div>
</template>

<template id="card_tmpl">
    <div class="archive-card glass item-container">
        <div class="card-header">
            <span class="status-badge"></span>
        </div>
        <h3 class="card-title title-text"></h3>
        <p class="card-url url-text"></p>
        <p class="card-desc desc-text"></p>
        <div class="card-tags tags-container" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;"></div>
        <div class="card-footer">
            <span class="created-text"></span>
        </div>
    </div>
</template>

<template id="list_row_tmpl">
    <div class="list-row glass item-container">
        <div class="list-col-main">
            <h3 class="title-text"></h3>
            <p class="url-text"></p>
        </div>
        <div class="list-col-status">
            <span class="status-badge"></span>
        </div>
        <div class="list-col-date">
            <span class="created-text"></span>
        </div>
    </div>
</template>

<template id="page_tmpl">
    <div class="page-view glass">
        <a onclick="history.back()" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to Archives
        </a>
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
                <h2 id="page_title"></h2>
                <h5 id="page_url" class="link-external" onclick="window.open(this.innerText, '_blank')"></h5>
            </div>
            <div style="display: flex; gap: 8px;">
                <button id="btn_edit_page" style="background: transparent; border: 1px solid var(--glass-border); color: var(--text-primary); padding: 6px 12px; border-radius: 6px; cursor: pointer;">Edit</button>
                <button id="btn_delete_page" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #ef4444; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Delete</button>
            </div>
        </div>
        
        <div class="page-body">
            <p id="page_description"></p>
            <h4 class="section-title">Archived Files</h4>
            <div id="results" class="results-grid"></div>
        </div>
    </div>
</template>

<template id="result_tmpl">
    <div class="result-card">
        <span class="format-badge"></span>
        <a class="result-link"></a>
    </div>
</template>

</body>
</html>
